name: Publish fork runtime images

on:
  push:
    branches:
      - "fix/update-smux-1.5.53"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/mydss-dev/flux-panel-backend
  FRONTEND_IMAGE: ghcr.io/mydss-dev/flux-panel-frontend

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Resolve version
        id: version
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Package backend
        working-directory: springboot-backend
        env:
          LOG_DIR: /tmp/flux-panel-logs
          JWT_SECRET: test-only-secret-with-sufficient-length-123456
          DB_HOST: 127.0.0.1
          DB_NAME: test
          DB_USER: test
          DB_PASSWORD: test
        run: mvn --batch-mode clean package

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: vite-frontend/package-lock.json

      - name: Build frontend
        working-directory: vite-frontend
        run: |
          npm ci
          npm run build

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: springboot-backend
          file: springboot-backend/Dockerfile.runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.BACKEND_IMAGE }}:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: vite-frontend
          file: vite-frontend/Dockerfile.runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.FRONTEND_IMAGE }}:latest

      - name: Remove temporary workflow
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-mydss-images.yml
          git commit -m "ci: remove temporary fork image publisher"
          git push
