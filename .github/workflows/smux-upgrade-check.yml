name: Temporary smux upgrade check

on:
  push:
    branches:
      - fix/update-smux-1.5.53

permissions:
  contents: write

jobs:
  verify-smux-upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/update-smux-1.5.53

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go-gost/go.mod
          cache: false

      - name: Update module checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd go-gost/x && go get github.com/xtaci/smux@v1.5.53)
          (cd go-gost && go get github.com/xtaci/smux@v1.5.53)

      - name: Test Go modules
        shell: bash
        run: |
          set -euo pipefail
          (cd go-gost/x && go test ./...)
          (cd go-gost && go test ./...)

      - name: Commit generated sums and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/smux-upgrade-check.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add go-gost/x/go.mod go-gost/x/go.sum go-gost/go.mod go-gost/go.sum .github/workflows/smux-upgrade-check.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'build: refresh module sums for smux v1.5.53'
          git push origin HEAD:fix/update-smux-1.5.53
