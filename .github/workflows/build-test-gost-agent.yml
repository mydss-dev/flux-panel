name: Build test GOST agent

on:
  workflow_dispatch:
  push:
    branches:
      - fix/update-smux-1.5.53
    paths:
      - 'go-gost/**'
      - '.github/workflows/build-test-gost-agent.yml'

permissions:
  contents: write

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go-gost/go.mod
          cache-dependency-path: go-gost/go.sum

      - name: Build linux amd64 agent
        working-directory: go-gost
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail
          go list -m github.com/xtaci/smux
          test "$(go list -m -f '{{.Version}}' github.com/xtaci/smux)" = "v1.5.53"
          go test ./...
          (cd x && go test ./...)
          go build -trimpath -ldflags='-s -w' -o ../gost-amd64 .
          cd ..
          ./gost-amd64 --agent-version
          sha256sum gost-amd64 > SHA256SUMS

      - name: Upload agent artifact
        uses: actions/upload-artifact@v4
        with:
          name: gost-amd64-smux-1.5.53
          path: |
            gost-amd64
            SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="agent-smux-1.5.53-test"
          gh release delete "$tag" --cleanup-tag -y 2>/dev/null || true
          gh release create "$tag" gost-amd64 SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "GOST Agent smux 1.5.53 test" \
            --notes "Test build for MTLS/MWSS stability. smux upgraded from v1.5.31 to v1.5.53. Linux amd64 only." \
            --prerelease
